<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Blog CMS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">Blog CMS</a>
      <nav class="nav-links" id="nav-auth-slot"></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Dashboard</h1>
      <div class="tabs">
        <button data-tab="posts" class="active">My Posts</button>
        <button data-tab="editor">New Post</button>
        <button data-tab="categories" id="categories-tab-btn" style="display:none">Categories</button>
      </div>

      <section id="tab-posts">
        <div id="posts-table-slot"><p class="muted">Loading...</p></div>
      </section>

      <section id="tab-editor" style="display:none">
        <div class="card">
          <h2 id="editor-title">New post</h2>
          <div id="editor-error-slot"></div>
          <form id="post-form">
            <input type="hidden" id="post-id" />
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" required />
            </div>
            <div class="form-group">
              <label for="summary">Summary</label>
              <input type="text" id="summary" />
            </div>
            <div class="form-group">
              <label for="content">Content</label>
              <textarea id="content" rows="8" required></textarea>
            </div>
            <div class="row" style="gap:16px">
              <div class="form-group" style="flex:1">
                <label for="category_id">Category</label>
                <select id="category_id"><option value="">None</option></select>
              </div>
              <div class="form-group" style="flex:1">
                <label for="status">Status</label>
                <select id="status">
                  <option value="draft">Draft</option>
                  <option value="published">Published</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="tags">Tags (comma separated)</label>
              <input type="text" id="tags" placeholder="fastapi, python, tips" />
            </div>
            <div class="form-group" id="cover-image-group" style="display:none">
              <label for="cover-image">Cover image</label>
              <input type="file" id="cover-image" accept="image/*" />
            </div>
            <div class="row">
              <button class="btn" type="submit">Save post</button>
              <button class="btn secondary" type="button" id="cancel-edit-btn">Cancel</button>
            </div>
          </form>
        </div>
      </section>

      <section id="tab-categories" style="display:none">
        <div class="card">
          <h2>Categories</h2>
          <form id="category-form" class="row" style="margin-bottom:16px">
            <input type="text" id="new-category-name" placeholder="New category name" />
            <button class="btn" type="submit">Add</button>
          </form>
          <table id="categories-table">
            <thead><tr><th>Name</th><th>Slug</th><th></th></tr></thead>
            <tbody id="categories-tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
